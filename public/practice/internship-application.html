<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASKbro Practice - Internship Application</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .checkbox-group input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .checkbox-group label {
      margin-bottom: 0;
      font-size: 12px;
      cursor: pointer;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }
    .btn-primary {
      background: var(--primary);
      border: 1px solid var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .alert-success {
      display: none;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #a7f3d0;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">ASKbro Agent Practice Environment</span>
      <h1>AI Engineering Internship Application</h1>
      <p class="subtitle">Controlled multi-step practice form for testing browser autonomous action loops.</p>
    </div>

    <div id="successBanner" class="alert-success">
      <strong>Application Submitted!</strong> Thank you for applying. Your application has been logged for evaluation.
    </div>

    <form id="applicationForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="e.g., Alex Johnson" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="alex@example.com" required />
      </div>

      <div class="form-group">
        <label for="college">College / University</label>
        <input type="text" id="college" name="college" placeholder="e.g., IIT Bombay, BITS Pilani" required />
      </div>

      <div class="form-group">
        <label for="track">Specialization Track</label>
        <select id="track" name="track">
          <option value="">Select track...</option>
          <option value="frontend">Frontend & Chrome Extension Development</option>
          <option value="ai-agent">Autonomous AI Agent Architectures</option>
          <option value="backend">Distributed Backend & Cloud Systems</option>
        </select>
      </div>

      <div class="form-group">
        <label for="coverNote">Why do you want to join? (Short note)</label>
        <textarea id="coverNote" name="coverNote" placeholder="Tell us about relevant projects or GitHub repos..."></textarea>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="terms" name="terms" />
        <label for="terms">I verify that the provided information is accurate</label>
      </div>

      <div class="actions">
        <button type="button" id="resetBtn" class="btn-secondary">Reset</button>
        <button type="submit" id="submitBtn" class="btn-primary">Submit Application</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('applicationForm');
    const banner = document.getElementById('successBanner');
    const resetBtn = document.getElementById('resetBtn');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      banner.style.display = 'block';
      banner.scrollIntoView({ behavior: 'smooth' });
    });

    resetBtn.addEventListener('click', () => {
      form.reset();
      banner.style.display = 'none';
    });
  </script>
</body>
</html>
